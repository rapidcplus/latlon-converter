<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
  <title>座標変換 10進法→60進法</title>
  <style>
    /* body全体の基本的なスタイル（日本語フォント対応） */
    body {
      font-family: 
        "Hiragino Kaku Gothic ProN", 
        "Hiragino Sans", 
        "Yu Gothic Medium", 
        "Meiryo", 
        "Takao", 
        "IPAexGothic", 
        "IPAPGothic", 
        "VL PGothic", 
        "Noto Sans CJK JP", 
        sans-serif;
      padding: 20px;
      -webkit-font-feature-settings: "palt";
      font-feature-settings: "palt";
    }

    /* 入力欄やラベルのスタイル */
    div {
      margin-bottom: 10px;
    }
    label {
      display: inline-block;
      width: 120px;
      font-family: inherit; /* 親要素のフォントを継承 */
    }
    input[type="number"] {
      width: 150px;
      padding: 5px;
      font-family: inherit; /* 親要素のフォントを継承 */
    }
    button {
      padding: 8px 15px;
      margin-top: 10px;
      font-family: inherit; /* 親要素のフォントを継承 */
    }

    /* 見出しのフォント設定 */
    h1, h2 {
      font-family: inherit;
      margin-bottom: 5px;
    }

    #resultArea {
      margin-top: 0;
      font-family: inherit; /* 親要素のフォントを継承 */
    }
    
    #resultArea p {
      margin-top: 2px;
      margin-bottom: 2px;
      font-family: inherit; /* 親要素のフォントを継承 */
    }

    /* 全体的な文字エンコーディング対応 */
    * {
      font-family: inherit;
    }
  </style>
</head>
<body>

  <h1>10進法から60進法に変換</h1>

  <div>
    <label for="latitudeInput">緯度(10進法):</label>
    <input type="number" id="latitudeInput" step="any" placeholder="例: 35.6812">
  </div>
  <div>
    <label for="longitudeInput">経度(10進法):</label>
    <input type="number" id="longitudeInput" step="any" placeholder="例: 139.7671">
  </div>

  <br>

  <button id="convertButton">変換</button>

  <h2>結果:</h2>
  <div id="resultArea">
    <p>緯度(60進法): <span id="resultLatitude"></span></p>
    <p>経度(60進法): <span id="resultLongitude"></span></p>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
