<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
  <title>緯度経度 10進法→60進法 変換</title>
  <style>
    /* body全体の基本的なスタイル（任意） */
    body {
      font-family: sans-serif; /* フォントを指定 */
      padding: 20px;         /* 内側の余白 */
    }

    /* 入力欄やラベルのスタイル（任意） */
    div {
      margin-bottom: 10px; /* 各入力セクションの下に余白 */
    }
    label {
      display: inline-block; /* ラベルと入力欄を横並びにするため */
      width: 120px;        /* ラベルの幅を揃える */
    }
    input[type="number"] {
      width: 150px;        /* 入力欄の幅 */
      padding: 5px;          /* 入力欄の内側の余白 */
    }
    button {
      padding: 8px 15px;     /* ボタンの余白 */
      margin-top: 10px;      /* ボタンの上の余白 */
    }

    /* --- ここからが間隔調整のCSS --- */
    h2 {
      margin-bottom: 5px; /* h2の下の余白を小さくする (デフォルトより詰める) */
      /* margin-bottom: 0; */ /* もっと詰めたい場合は0にする */
    }

    #resultArea {
      margin-top: 0;      /* 結果表示エリアの上の余白をなくす */
    }
    #resultArea p {
      margin-top: 5px;       /* 結果の各行の上の余白 */
      margin-bottom: 5px;    /* 結果の各行の下の余白 */
    }
    /* --- ここまでが間隔調整のCSS --- */

  </style>
</head>
<body>

  <h1>10進法→60進法に変換</h1>

  <div>
    <label for="latitudeInput">緯度(10進法):</label>
    <input type="number" id="latitudeInput" step="any" placeholder="例: 35.6812">
  </div>
  <div>
    <label for="longitudeInput">経度(10進法):</label>
    <input type="number" id="longitudeInput" step="any" placeholder="例: 139.7671">
  </div>

  <br>

  <button id="convertButton">変換</button>

  <h2>結果:</h2>
  <div id="resultArea">
    <p>緯度(60進法): <span id="resultLatitude"></span></p>
    <p>経度(60進法): <span id="resultLongitude"></span></p>
  </div>

  <!-- You can also require other files to run in this process -->
  <script src="./renderer.js"></script>
</body>
</html>
